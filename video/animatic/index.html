<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Commit. animatic</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#000;font-family:-apple-system,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;color:#f2f5f3}
#stage{position:relative;width:720px;height:1280px;overflow:hidden}
#bg{position:absolute;inset:0}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%);pointer-events:none}
#scene{position:absolute;inset:0;will-change:transform,filter,opacity;transform-origin:50% 34%}
.hud{position:absolute;left:36px;right:36px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);display:flex;justify-content:space-between;font-weight:600}
#hud-top{top:34px}
#slug{position:absolute;left:36px;right:36px;top:84px;font-size:26px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff}
#action{position:absolute;left:36px;right:36px;font-size:23px;line-height:1.38;color:rgba(255,255,255,.72);font-weight:500}
#action.big{top:300px;font-size:38px;line-height:1.32;color:#fff;font-weight:600;text-align:left}
#action.small{top:128px}
#phone{position:absolute;left:50%;top:218px;width:420px;height:881px;margin-left:-210px;padding:12px;border-radius:58px;background:#0a0a0a;box-shadow:0 0 0 2px #3a3d3b,0 0 0 5px #151716,0 40px 90px rgba(0,0,0,.65)}
#phone .scr{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#000}
#phone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ripple{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid rgba(32,240,170,.95);background:rgba(32,240,170,.35);pointer-events:none}
#banner{position:absolute;left:50%;top:360px;width:600px;margin-left:-300px;padding:22px 24px;border-radius:34px;background:rgba(40,44,42,.78);backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14)}
#banner .row{display:flex;gap:16px;align-items:center}
#banner .ico{width:64px;height:64px;border-radius:16px;background:#0b0e0c;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#fff;border:1px solid rgba(255,255,255,.12)}
#banner .ico i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#20f0aa;margin-left:2px}
#banner .app{font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700}
#banner .ttl{font-size:30px;font-weight:800;line-height:1.2;margin-top:2px}
#banner .bdy{font-size:22px;line-height:1.35;color:rgba(255,255,255,.78);margin-top:6px}
#banner .btn{display:inline-block;margin-top:16px;padding:12px 28px;border-radius:99px;background:#20f0aa;color:#04110b;font-weight:800;font-size:24px}
#caps{position:absolute;left:36px;right:36px;bottom:92px;display:flex;flex-direction:column;gap:10px;justify-content:flex-end}
.cap{padding:14px 20px;border-radius:22px;background:rgba(10,12,11,.72);backdrop-filter:blur(10px);font-size:30px;line-height:1.28;font-weight:600;border:1px solid rgba(255,255,255,.1)}
.cap b{display:block;font-size:17px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;font-weight:800}
#hud-bot{position:absolute;left:36px;right:36px;bottom:28px;font-size:17px;color:rgba(255,255,255,.4);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:flex-end}
#eq{display:flex;gap:4px;align-items:flex-end;height:26px}
#eq i{display:block;width:6px;background:#20f0aa;border-radius:3px}
#prog{position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.1)}
#prog i{position:absolute;left:0;top:0;bottom:0;background:#20f0aa}
#chime{position:absolute;left:50%;top:430px;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:4px solid #20f0aa;pointer-events:none}
#chimelabel{position:absolute;left:0;right:0;top:128px;text-align:center;font-size:24px;font-weight:800;letter-spacing:.2em;color:#20f0aa}
#end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
#end .logo{font-size:150px;font-weight:900;letter-spacing:-.04em}
#end .logo i{display:inline-block;width:30px;height:30px;border-radius:50%;background:#20f0aa;margin-left:6px}
#end .tag{font-size:38px;font-weight:600;max-width:560px;line-height:1.25}
#end .cta{font-size:26px;color:#20f0aa;font-weight:700;letter-spacing:.06em}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="scene">
    <div id="slug"></div>
    <div id="action"></div>
    <div id="phone"><div class="scr" id="scr"></div></div>
    <div id="banner"><div class="row"><div class="ico">C<i></i></div><div><div class="app">Commit.</div></div></div><div class="ttl" id="b-ttl"></div><div class="bdy" id="b-bdy"></div><div class="btn" id="b-btn"></div></div>
    <div id="end"><div class="logo">Commit<i id="dot"></i></div><div class="tag">Put your money where your goals are.</div><div class="cta">Start your first task today.</div></div>
  </div>
  <div id="vignette"></div>
  <div class="hud" id="hud-top"><span id="h-left"></span><span id="h-right"></span></div>
  <div id="chimelabel"></div>
  <div id="chime"></div>
  <div id="caps"></div>
  <div id="hud-bot"><span id="h-note"></span><span id="eq"></span></div>
  <div id="prog"><i></i></div>
</div>
<script>
'use strict';
const MOODS = {
  warm:  ['#4a2e12', '#140c05'], cold: ['#18222e', '#06090d'], night: ['#2a1f15', '#0b0907'],
  dawn:  ['#14264a', '#070b14'], gym: ['#1c2220', '#080a09'], end: ['#0c1210', '#050807']
};
const WHO = {
  ALEX: '#20f0aa', 'ALEX (NOW)': '#ffc46b', 'ALEX (THEN)': '#9fc6ff', DANI: '#8db8ff', REGULAR: '#ffb25e',
  DESK: '#d6a8ff', 'DANI (TEXT)': '#8db8ff', 'ALEX (TYPING)': '#20f0aa'
};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, k) => { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 4);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const spring = x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(12 * x); };
const $ = id => document.getElementById(id);

let DATA = null, FILM_LEN = 120;
const imgs = {};
const eq = $('eq'); for (let i = 0; i < 9; i++) eq.appendChild(document.createElement('i'));

window.load = async data => {
  DATA = data; FILM_LEN = data.length;
  const srcs = new Set();
  data.scenes.forEach(s => (s.phones || []).forEach(p => srcs.add(p.src)));
  await Promise.all([...srcs].map(src => new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(); im.onerror = () => rej(new Error('missing ' + src));
    im.src = '/video/screens/dark/' + src; imgs[src] = im;
  })));
  const scr = $('scr');
  data.scenes.forEach(s => (s.phones || []).forEach((p, i) => { /* images are created lazily below */ }));
  return true;
};

function sceneAt(t) { return DATA.scenes.find(s => t >= s.t0 && t < s.t1) || DATA.scenes[DATA.scenes.length - 1]; }

const imgEls = {};
function imgEl(src) {
  if (!imgEls[src]) { const el = document.createElement('img'); el.src = imgs[src].src; $('scr').appendChild(el); imgEls[src] = el; }
  return imgEls[src];
}

window.renderAt = t => {
  const s = sceneAt(t), lt = t - s.t0, dur = s.t1 - s.t0;
  const lbl = DATA.label;

  // background grade (a mood can be a pair [from, to] blended across the scene)
  const m = Array.isArray(s.mood) ? s.mood : [s.mood, s.mood];
  const k = easeInOut(lt / dur);
  const top = mix(MOODS[m[0]][0], MOODS[m[1]][0], k), bot = mix(MOODS[m[0]][1], MOODS[m[1]][1], k);
  $('bg').style.background = `radial-gradient(ellipse at 50% 30%, ${top}, ${bot} 70%)`;

  // scene entry / exit
  const sc = $('scene');
  let op = 1, tx = 0, scale = 1, blur = 0, hue = 0;
  const inT = lt / (s.enter === 'emerge' ? .6 : .32);
  if (s.enter === 'emerge') { scale = 1 + 2.4 * (1 - easeOut(inT)); blur = 18 * (1 - easeOut(inT)); op = clamp(inT * 3); }
  else if (s.enter === 'whip') { tx = 160 * (1 - easeOut(inT)); blur = 16 * (1 - easeOut(inT)); op = clamp(inT * 3); }
  else op = clamp(inT * 1.4);
  const outT = (dur - lt) / .22;
  if (s.fx === 'zoomOut') { const z = easeInOut(lt / dur); scale = 1 + 2.4 * z; blur = 22 * clamp((lt / dur - .5) * 2); hue = 70 * z; op = clamp((1 - lt / dur) * 4.5 + .0) ; op = lt / dur < .72 ? 1 : clamp((1 - lt / dur) / .28); }
  else if (s.fx === 'whipOut') { const o = clamp((lt - (dur - .3)) / .3); tx = -160 * easeOut(o); blur = Math.max(blur, 16 * o); op = Math.min(op, 1 - o * .9); }
  else op = Math.min(op, clamp(outT * 1.2));
  sc.style.opacity = op;
  sc.style.transform = `translateX(${tx}px) scale(${scale})`;
  sc.style.filter = `blur(${blur}px) hue-rotate(${hue}deg)`;

  // text blocks
  $('slug').textContent = s.slug || '';
  const hasPhone = !!(s.phones && s.phones.length), hasBanner = !!s.banner, isEnd = s.type === 'end';
  const act = $('action');
  act.textContent = s.action || '';
  act.className = hasPhone || hasBanner ? 'small' : 'big';
  act.style.display = isEnd ? 'none' : 'block';
  $('slug').style.display = isEnd ? 'none' : 'block';
  $('end').style.display = isEnd ? 'flex' : 'none';

  // phone inserts: spring in, shared-element crossfade between screens, slow push-in, tap ripples
  const ph = $('phone');
  if (hasPhone) {
    ph.style.display = 'block';
    const enter = spring(lt / .7);
    const push = 1 + .045 * (lt / dur);
    ph.style.transform = `translateY(${(1 - enter) * 300}px) scale(${push})`;
    ph.style.opacity = clamp(lt / .2);
    // which screen is current
    let idx = 0; s.phones.forEach((p, i) => { if (lt >= (p.at || 0)) idx = i; });
    const cur = s.phones[idx], prev = s.phones[idx - 1];
    const x = easeOut((lt - (cur.at || 0)) / .38);
    Object.values(imgEls).forEach(el => { el.style.opacity = 0; });
    if (prev && x < 1) { const e = imgEl(prev.src); e.style.opacity = 1 - x; e.style.transform = `translateX(${-60 * x}px)`; }
    const ce = imgEl(cur.src); ce.style.opacity = prev ? x : 1; ce.style.transform = prev ? `translateX(${60 * (1 - x)}px)` : 'none';
    // tap ripples
    document.querySelectorAll('.ripple').forEach(r => r.remove());
    s.phones.forEach(p => (p.taps || []).forEach(tp => {
      const rt = (lt - tp.at) / .6;
      if (rt >= 0 && rt <= 1) {
        const r = document.createElement('div'); r.className = 'ripple';
        r.style.left = (tp.x * 100) + '%'; r.style.top = (tp.y * 100) + '%';
        r.style.transform = `scale(${.4 + 1.4 * easeOut(rt)})`; r.style.opacity = 1 - rt;
        $('scr').appendChild(r);
      }
    }));
  } else ph.style.display = 'none';

  // lock-screen banner prop
  const bn = $('banner');
  if (hasBanner) {
    bn.style.display = 'block';
    const e = spring(lt / .6);
    bn.style.transform = `translateY(${(1 - e) * -220}px) scale(${1 + .03 * (lt / dur)})`;
    bn.style.opacity = clamp(lt / .2);
    $('b-ttl').textContent = s.banner.title; $('b-bdy').textContent = s.banner.body;
    $('b-btn').textContent = s.banner.button || ''; $('b-btn').style.display = s.banner.button ? 'inline-block' : 'none';
  } else bn.style.display = 'none';

  if (isEnd) {
    const pulse = 1 + .35 * Math.max(0, Math.sin(clamp(lt / 1.2) * Math.PI)) * (lt < 1.2 ? 1 : 0);
    $('dot').style.transform = `scale(${pulse})`;
    $('end').style.opacity = clamp(lt / .6);
  }

  // dialogue captions: typed at ~45 chars/second, the latest two stay on screen
  const lines = (s.lines || []).map((l, i, a) => ({ ...l, at: l.at != null ? l.at : .3 + i * ((dur - .8) / a.length) }));
  let html = '';
  const shown = lines.filter(l => lt >= l.at).slice(-2);
  shown.forEach((l, i) => {
    const age = lt - l.at, n = Math.min(l.text.length, Math.floor(age * 45));
    const last = i === shown.length - 1;
    const col = WHO[l.who] || '#fff';
    html += `<div class="cap" style="opacity:${last ? 1 : .55};transform:translateY(${last ? (1 - easeOut(age / .25)) * 20 : 0}px)"><b style="color:${col}">${l.who}</b>${l.text.slice(0, n)}</div>`;
  });
  $('caps').innerHTML = html;

  // sound markers: chime ring + groove equaliser
  const abs = t;
  let chimeLbl = '', ring = -1;
  DATA.events.filter(e => e.type === 'chime').forEach((e, i) => { const d = abs - e.t; if (d >= 0 && d < .9) { ring = d / .9; chimeLbl = '♪ CHIME'; } });
  const ringEl = $('chime');
  if (ring >= 0) { ringEl.style.display = 'block'; ringEl.style.transform = `scale(${1 + 22 * easeOut(ring)})`; ringEl.style.opacity = 1 - ring; } else ringEl.style.display = 'none';
  $('chimelabel').textContent = chimeLbl; $('chimelabel').style.opacity = ring >= 0 ? 1 - ring : 0;
  let groove = false;
  DATA.events.filter(e => e.type === 'groove-on' || e.type === 'groove-off').forEach(e => { if (abs >= e.t) groove = e.type === 'groove-on'; });
  [...eq.children].forEach((b, i) => { b.style.height = (groove ? 6 + 20 * Math.abs(Math.sin(abs * 5.2 + i * 1.7) * Math.cos(abs * 2.1 + i)) : 4) + 'px'; b.style.opacity = groove ? 1 : .3; });

  // hud + progress
  $('h-left').textContent = s.act || '';
  const sec = Math.floor(t);
  $('h-right').textContent = `Shot ${s.id} · ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  $('h-note').textContent = `${lbl} · animatic · temp score`;
  $('prog').firstElementChild.style.width = (t / FILM_LEN * 100) + '%';
};
</script>
</body>
</html>
